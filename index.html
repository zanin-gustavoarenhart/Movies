<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies List</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="page">
        <header class="main-header">
            <h1 id="page-title">Movies List</h1>

            <div class="header-actions">
                <p id="summary" class="summary">Carregando...</p>
                <div class="language-picker">
                    <button onclick="changeLanguage('pt-br')" id="btn-pt" class="active">PT</button>
                    <button onclick="changeLanguage('en')" id="btn-en">EN</button>
                </div>
            </div>
        </header>

        <div id="content" class="content"></div>
    </main>

    <template id="movie-card-template">
        <article class="movie-card">
            <img src="" alt="" class="movie-poster" />

            <div class="movie-content">
                <h3 class="movie-title"></h3>

                <dl class="movie-meta">
                    <div class="field-or">
                        <dt id="label-or">Título original</dt>
                        <dd class="title-original"></dd>
                    </div>
                    <div class="field-en">
                        <dt id="label-en">Título em inglês</dt>
                        <dd class="title-en"></dd>
                    </div>
                    <div class="field-pt">
                        <dt id="label-pt">Título em português</dt>
                        <dd class="title-ptbr"></dd>
                    </div>
                </dl>

                <footer class="movie-footer">
                    <div class="field-oscar">
                        <span class="oscar-label"></span> <strong class="oscar-count"></strong>
                    </div>
                    <div class="rating-box">
                        <span class="rating-value"></span><span class="rating-max">/10</span>
                    </div>
                </footer>
            </div>
        </article>
    </template>

    <script>
        let movieData = [];
        let currentLanguage = 'pt-br';

        function formatText(value) {
            return (value === null || value === undefined || String(value).trim() === "") ? null : String(value);
        }

        function changeLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('btn-pt').className = lang === 'pt-br' ? 'active' : '';
            document.getElementById('btn-en').className = lang === 'en' ? 'active' : '';
            renderMovies(movieData);
        }

        function createCard(movie) {
            const template = document.querySelector("#movie-card-template");
            const card = template.content.firstElementChild.cloneNode(true);

            const imgElement = card.querySelector(".movie-poster");
            const posterSrc = formatText(movie.poster);

            if (posterSrc) {
                imgElement.src = posterSrc;
                imgElement.alt = formatText(movie[currentLanguage]) || formatText(movie.or) || "Poster";
                imgElement.style.display = "block";
            } else {
                imgElement.style.display = "none";
            }

            const selectedTitle = formatText(movie[currentLanguage]);
            const originalTitle = formatText(movie.or);
            const titleValue = selectedTitle || originalTitle;
            card.querySelector(".movie-title").textContent = titleValue;

            const ratingValue = movie.rating;
            const rating = Number.isInteger(ratingValue) ? ratingValue.toString() : ratingValue.toFixed(1);
            card.querySelector(".rating-value").textContent = rating || "N/A";

            const oscarField = card.querySelector(".field-oscar");
            const labelElement = card.querySelector(".oscar-label");
            const countElement = card.querySelector(".oscar-count");

            let count = 0;
            if (Array.isArray(movie.oscar)) {
                count = movie.oscar.length;
            } else if (typeof movie.oscar === "string") {
                count = movie.oscar.trim() ? 1 : 0;
            } else if (typeof movie.oscar === "number" && Number.isFinite(movie.oscar)) {
                count = Math.max(0, Math.floor(movie.oscar));
            }

            if (count > 0) {
                labelElement.textContent = "Oscars:";
                countElement.textContent = count;
                oscarField.style.display = "block";
            } else {
                oscarField.style.display = "none";
            }

            if (currentLanguage === 'en') {
                card.querySelector("#label-or").textContent = "Original Title";
                card.querySelector("#label-en").textContent = "English Title";
                card.querySelector("#label-pt").textContent = "Portuguese Title";
            } else {
                card.querySelector("#label-or").textContent = "Título original";
                card.querySelector("#label-en").textContent = "Título em inglês";
                card.querySelector("#label-pt").textContent = "Título em português";
            }

            const fields = [
                { class: ".field-or", val: originalTitle },
                { class: ".field-en", val: formatText(movie.en) },
                { class: ".field-pt", val: formatText(movie["pt-br"]) }
            ];

            fields.forEach(field => {
                const element = card.querySelector(field.class);
                if (!field.val || field.val === titleValue) {
                    element.style.display = "none";
                } else {
                    element.style.display = "grid";
                    element.querySelector("dd").textContent = field.val;
                }
            });

            return card;
        }

        function renderMovies(data) {
            const content = document.querySelector("#content");
            const summary = document.querySelector("#summary");

            const allMovies = data.flatMap(g => g.itens || []);
            summary.textContent = allMovies.length + (currentLanguage === 'pt-br' ? " títulos" : " titles");

            content.innerHTML = "";

            data.forEach(group => {
                const section = document.createElement("section");
                section.className = "year-section";
                section.innerHTML = `<h2 class="year-title">${group.year}</h2><div class="movie-grid"></div>`;
                const grid = section.querySelector(".movie-grid");

                const sortedItems = [...(group.itens || [])].sort((a, b) => {
                    const titleA = (formatText(a[currentLanguage]) || formatText(a.or) || "").toLowerCase();
                    const titleB = (formatText(b[currentLanguage]) || formatText(b.or) || "").toLowerCase();
                    return titleA.localeCompare(titleB, currentLanguage);
                });

                sortedItems.forEach(m => grid.appendChild(createCard(m)));
                content.appendChild(section);
            });
        }

        async function init() {
            try {
                const response = await fetch("./movies.json");
                movieData = await response.json();
                changeLanguage('pt-br');
            } catch (e) {
                document.querySelector("#summary").textContent = "Error loading movies.";
            }
        }
        init();
    </script>
</body>

</html>
